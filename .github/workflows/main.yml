on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m unittest discover -p "*tests.py"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m unittest discover -p "*tests.py"
